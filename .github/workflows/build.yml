name: Build venus boot.img with Ralink RT2800USB

on:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev python3 libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git curl tar cpio lz4 xz-utils

      - name: Find correct kernel source for commit a5c070f3fd9c
        run: |
          mkdir kernel
          cd kernel
          git init -q

          CANDIDATES=(
            "https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git"
            "https://github.com/Evolution-X-Devices/kernel_xiaomi_venus.git"
            "https://github.com/AOSP-for-venus/platform_kernel_xiaomi_sm8350.git"
            "https://github.com/crdroidandroid/android_kernel_xiaomi_sm8350.git"
          )

          FOUND=""
          for url in "${CANDIDATES[@]}"; do
            echo "=== Trying $url ==="
            git remote remove origin 2>/dev/null || true
            git remote add origin "$url"
            if git fetch --depth 1 origin a5c070f3fd9c 2>/tmp/fetch_err; then
              echo ">>> FOUND in $url <<<"
              FOUND="$url"
              git checkout -q FETCH_HEAD
              break
            else
              cat /tmp/fetch_err
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "COMMIT NOT FOUND IN ANY CANDIDATE REPO"
            exit 1
          fi

          echo "$FOUND" > /tmp/found_repo.txt
          curl -fL -o build_boot.sh https://github.com/jocay/android_kernel_xiaomi_sm8350/raw/refs/heads/lineage-23.2/build_boot.sh
          chmod +x build_boot.sh

      - name: Download official images
        run: |
          mkdir images
          curl -fL --retry 3 -o images/boot.img "https://sourceforge.net/projects/evolution-x/files/venus/14/boot/boot.img/download"
          curl -fL --retry 3 -o images/vendor_boot.img "https://sourceforge.net/projects/evolution-x/files/venus/14/vendor_boot/vendor_boot.img/download"
          ls -l images

      - name: Add Ralink config fragment
        run: |
          cat > kernel/arch/arm64/configs/vendor/rt2800.config <<'EOF'
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2X00=y
          CONFIG_RT2800USB=y
          EOF

      - name: Build with RT2800USB
        working-directory: kernel
        env:
          IMAGES_DIR: ${{ github.workspace }}/images
          EXTRA_CONFIGS: "rt2800.config"
        run: ./build_boot.sh

      - name: Show resulting config
        run: grep -E "CONFIG_RT2X00=|CONFIG_RT2800USB=|CONFIG_WLAN_VENDOR_RALINK=" kernel/out/kernel_obj/.config

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: venus-boot-rt2800usb
          path: kernel/out/boot.img
